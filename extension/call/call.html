<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huddle · Deskmate</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <header>
    <div>
      <div class="h-title" id="title">Huddle</div>
      <div class="h-sub" id="sub">Connecting…</div>
    </div>
    <div class="pill" id="clock">0:00</div>
  </header>
  <section class="tiles" id="tiles"></section>
  <div class="note" id="note" hidden></div>
  <div class="invite card" id="inviteMenu" hidden></div>
  <footer>
    <button class="ctl" id="mute" title="Mute (M)" aria-label="Mute">
      <svg class="on" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1M12 18v4"/></svg>
      <svg class="off" viewBox="0 0 24 24"><path d="m2 2 20 20M9 9v2a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.8M17 16.9A7 7 0 0 1 5 11v-1m14 0v1a7 7 0 0 1-.1 1.2M12 18v4"/></svg>
    </button>
    <button class="ctl" id="invite" title="Add a teammate" aria-label="Add teammate">
      <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
    </button>
    <button class="ctl leave" id="leave" title="Leave" aria-label="Leave call">
      <svg viewBox="0 0 24 24"><path d="M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2A19.8 19.8 0 0 1 3.1 4.2 2 2 0 0 1 5.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.4 2.1L9.1 9.8" transform="rotate(135 12 12)"/></svg>
    </button>
  </footer>
  <script type="module" src="call.js"></script>
</body>
</html>
