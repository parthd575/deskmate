<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Call · Deskmate</title>
  <link rel="stylesheet" href="call.css">
</head>
<body>
  <main class="room" id="room">
    <section class="stage" id="stage" hidden>
      <video id="stageVideo" autoplay playsinline muted></video>
      <div class="stage-label" id="stageLabel"></div>
    </section>
    <section class="grid" id="grid"></section>
    <aside class="panel" id="panel" hidden>
      <header><b>People</b><button class="x" id="closePanel" aria-label="Close">✕</button></header>
      <div class="panel-sec">In the call</div>
      <ul id="inCall"></ul>
      <div class="panel-sec">Add a teammate</div>
      <ul id="addList"></ul>
    </aside>
  </main>

  <div class="toast" id="note" hidden></div>
  <div class="react-layer" id="reactLayer"></div>
  <div class="tray" id="tray" hidden></div>

  <footer class="bar">
    <div class="meta"><span id="clock">--:--</span><span class="sep"></span><span id="title">Deskmate call</span></div>
    <div class="controls">
      <button class="ctl" id="mic" title="Turn off microphone (⌘D)" aria-label="Microphone">
        <svg class="on" viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-3.1A7 7 0 0 0 19 11h-2Z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="M19 11h-1.7c0 .7-.2 1.4-.4 2l1.2 1.2c.6-.9.9-2 .9-3.2Zm-4 .2V5a3 3 0 0 0-5.9-.8L15 10.1v1.1ZM4.3 3 3 4.3l6 6V11a3 3 0 0 0 4.5 2.6l1.6 1.6A5 5 0 0 1 7 11H5a7 7 0 0 0 6 6.9V21h2v-3.1a7 7 0 0 0 3.1-1.2l3.6 3.6 1.3-1.3L4.3 3Z"/></svg>
      </button>
      <button class="ctl" id="cam" title="Turn off camera (⌘E)" aria-label="Camera">
        <svg class="on" viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>
        <svg class="off" viewBox="0 0 24 24"><path d="m21 6.5-4 4V7a1 1 0 0 0-1-1H9.8L21 17.2V6.5ZM3.3 2 2 3.3 4.7 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12c.2 0 .4-.1.5-.2l3.2 3.2 1.3-1.3L3.3 2Z"/></svg>
      </button>
      <button class="ctl" id="share" title="Present your screen" aria-label="Present screen">
        <svg viewBox="0 0 24 24"><path d="M20 18a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2H0v2h24v-2h-4ZM4 16V6h16v10H4Zm8-9-4 4h3v4h2v-4h3l-4-4Z"/></svg>
      </button>
      <button class="ctl" id="react" title="Send a reaction" aria-label="Reactions">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm-7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Zm3.5 6.5a5.5 5.5 0 0 0 5.1-3.5H6.9a5.5 5.5 0 0 0 5.1 3.5Z"/></svg>
      </button>
      <button class="ctl" id="hand" title="Raise hand" aria-label="Raise hand">
        <svg viewBox="0 0 24 24"><path d="M21 7a2 2 0 0 0-3-1.7V4a2 2 0 0 0-3.4-1.4A2 2 0 0 0 11 3v.3A2 2 0 0 0 8 5v7.6l-1.6-1.5a2.2 2.2 0 0 0-3 .1 2 2 0 0 0 0 2.8l4.8 5.3A7 7 0 0 0 13.4 22h.6a7 7 0 0 0 7-7V7Zm-2 8a5 5 0 0 1-5 5h-.6a5 5 0 0 1-3.7-1.6l-4.8-5.3.1-.1L10 17V5h0v7h2V3h0v9h2V4h0v8h2V7h0v6h2l1-.1V15Z"/></svg>
      </button>
      <button class="ctl leave" id="leave" title="Leave call" aria-label="Leave call">
        <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.2.3-4.6.7v3.1c0 .4-.2.7-.6.9a11 11 0 0 0-2.6 1.8.9.9 0 0 1-1.3 0L.3 13.1a.9.9 0 0 1 0-1.3C3.4 8.9 7.5 7.3 12 7.3s8.6 1.6 11.7 4.5a.9.9 0 0 1 0 1.3l-2.5 2.4a.9.9 0 0 1-1.3 0 11 11 0 0 0-2.6-1.8.9.9 0 0 1-.5-.8V9.7C15.2 9.3 13.6 9 12 9Z"/></svg>
      </button>
    </div>
    <div class="side">
      <button class="ctl flat" id="people" title="People" aria-label="People">
        <svg viewBox="0 0 24 24"><path d="M15 8a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm-3 5c-3.3 0-6 1.5-6 3.5V19h12v-2.5c0-2-2.7-3.5-6-3.5Zm7-3a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm0 1c-.7 0-1.4.1-2 .4 1.2.9 2 2.1 2 3.6V19h4v-2.5C24 14.6 21.8 11 19 11ZM5 10a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm2 1.4A5 5 0 0 0 5 11c-2.8 0-5 3.6-5 5.5V19h4v-3c0-1.5.8-2.7 2-3.6Z"/></svg>
        <span class="count" id="count">1</span>
      </button>
    </div>
  </footer>
  <script type="module" src="call.js"></script>
</body>
</html>
