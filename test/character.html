<!doctype html>
<html><head><meta charset="utf-8"><title>Deskmate character preview</title>
<style>html,body{margin:0;height:100%;background:radial-gradient(120% 90% at 50% 20%,#fdf8f3 0%,#efe9f6 60%,#e3e8f5 100%);overflow:hidden} canvas{display:block}</style></head>
<body>
<script type="module">
// Preview one character. Params: act=idle|wave|type|raise|talk|cross  shot=hero|face|full  t=seconds
import * as THREE from '../extension/lib/three.module.min.js';
import { RoomEnvironment } from '../extension/lib/RoomEnvironment.js';
import { createCharacter } from '../extension/lib/character.js';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const r = new THREE.WebGLRenderer({ antialias: true, alpha: true });
r.setPixelRatio(Number(q.get('dpr') || 2)); r.setSize(W, H);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NeutralToneMapping; r.toneMappingExposure = 1.0;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(r);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
const key = new THREE.DirectionalLight('#fff0e0', 2.0); key.position.set(2.5, 4, 3.5); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 8; key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01;
Object.assign(key.shadow.camera, { left: -2, right: 2, top: 2, bottom: -2 });
const fill = new THREE.DirectionalLight('#dfe8ff', 0.6); fill.position.set(-3, 2, 2);
const rim = new THREE.DirectionalLight('#ffffff', 1.3); rim.position.set(-1.5, 3, -4);
scene.add(key, fill, rim, new THREE.HemisphereLight('#ffffff', '#e8dcd0', 0.4));
const ground = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.ShadowMaterial({ opacity: 0.16 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const c = createCharacter({
  color: q.get('color') || '#8EB8FF', skin: q.get('skin') || '#F2C7A5', hair: q.get('hair') || '#5B3A29',
  style: q.get('style') || 'beanie', glasses: q.get('glasses') || 'none', pants: q.get('pants') || '#8E97A8', shoes: q.get('shoes') || '#FF8A72', eyes: q.get('eyes') || undefined, stripe: q.has('stripe'), tee: q.has('tee'), species: q.get('species') || 'human', glow: q.get('glow') || undefined,
});
c.pose = q.get('pose') || 'stand'; c.activity = q.get('act') || 'idle'; c.phase = 0; if (!q.get('look')) c.lookAround = false;
if (q.get('phones')) c.setHeadphones(true, true);
c.root.rotation.y = Number(q.get('ry') || -0.35);
scene.add(c.root);
const cam = new THREE.PerspectiveCamera(Number(q.get('fov') || 28), W / H, 0.05, 50);
const shot = q.get('shot') || 'full';
if (shot === 'face') { cam.position.set(0.22, 1.22, 1.5); cam.lookAt(0, 1.12, 0); }
else if (shot === 'hero') { cam.position.set(0.5, 1.2, 2.7); cam.lookAt(0, 0.92, 0); }
else { cam.position.set(0.6, 1.15, 4.0); cam.lookAt(0, 0.8, 0); }
let t = Number(q.get('t') || 0);
const clock = new THREE.Clock();
const fixed = q.has('frozen');
// manual frame stepping for recording clips: renderFrame(dt, {act, ry})
window.renderFrame = (dt, o = {}) => {
  if (o.act) c.activity = o.act;
  if (o.ry !== undefined) c.root.rotation.y = o.ry;
  t += dt; c.update(t, dt); r.render(scene, cam);
};
function loop() {
  if (q.has('manual')) return;
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!fixed) t += dt;
  c.update(t, fixed ? 0.016 : dt);
  if (q.get('spin')) c.root.rotation.y += dt * 0.5;
  r.render(scene, cam);
  requestAnimationFrame(loop);
}
// settle springs before the first frame
for (let i = 0; i < 120; i++) { c.update(t + i / 60, 1 / 60); }
t += 2;
loop();
window.__ready = true;
</script>
</body></html>
